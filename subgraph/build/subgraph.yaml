specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: ParametricVault
    network: lisk-sepolia-testnet
    source:
      address: "0x6e1cA331F1f701d7B24f7367f5c8A9D07EeEc518"
      abi: ParametricVault
      startBlock: 31720000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
        - Withdrawal
        - Task
        - TaskVerified
        - Emergency
        - VaultStats
        - DonorStats
        - VolunteerStats
        - Campaign
        - CampaignDeposit
        - FinancialActivity
      abis:
        - name: ParametricVault
          file: ParametricVault\abis\ParametricVault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
        - event: TaskCreated(indexed uint256,string,uint256)
          handler: handleTaskCreated
        - event: TaskClaimed(indexed uint256,indexed address)
          handler: handleTaskClaimed
        - event: TaskProofSubmitted(indexed uint256,bytes32)
          handler: handleTaskProofSubmitted
        - event: TaskVerified(indexed uint256,indexed address,uint256)
          handler: handleTaskVerified
        - event: TaskCancelled(indexed uint256)
          handler: handleTaskCancelled
        - event: EmergencyDeclared(indexed uint256,bytes32,uint256)
          handler: handleEmergencyDeclared
        - event: EmergencySettled(indexed uint256,uint256)
          handler: handleEmergencySettled
        - event: CampaignCreated(indexed uint256,string,uint256,bytes32)
          handler: handleCampaignCreated
        - event: CampaignDeposit(indexed uint256,indexed address,uint256)
          handler: handleCampaignDeposit
        - event: CampaignClosed(indexed uint256,uint256,uint8)
          handler: handleCampaignClosed
      file: ParametricVault\ParametricVault.wasm
  - kind: ethereum
    name: RescueToken
    network: lisk-sepolia-testnet
    source:
      address: "0x4080ACE95cf319c40F952D2dCCE21b070270f14d"
      abi: RescueToken
      startBlock: 31720000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Delegate
        - Delegation
        - DelegateStats
      abis:
        - name: RescueToken
          file: RescueToken\abis\RescueToken.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: RescueToken\RescueToken.wasm
  - kind: ethereum
    name: ImpactNFT
    network: lisk-sepolia-testnet
    source:
      address: "0x7D1E0D4C089c6FC1F4500f6C98365DDA6D316E8B"
      abi: ImpactNFT
      startBlock: 31720000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Impact
        - TierUpgrade
      abis:
        - name: ImpactNFT
          file: ImpactNFT\abis\ImpactNFT.json
      eventHandlers:
        - event: ImpactRecorded(indexed address,uint256,uint256,uint256,uint8)
          handler: handleImpactRecorded
        - event: TierUpgrade(indexed address,uint8,uint8)
          handler: handleTierUpgrade
      file: ImpactNFT\ImpactNFT.wasm
